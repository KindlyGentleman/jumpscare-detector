[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jumpscare-detector"
version = "0.1.0"
description = "A tool to detect audio and visual jumpscares in media files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "KindlyGentleman" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "scienceplots>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
jumpscare-detector = "jumpscare_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
